<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Twitter Simulation - Login</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-box">
            <div class="auth-header">
                <svg class="logo" viewBox="0 0 24 24" aria-hidden="true">
                    <g><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"></path></g>
                </svg>
                <h1>Welcome to Twitter</h1>
            </div>

            <!-- Login Form -->
            <div id="loginForm" class="form-container">
                <h2>Sign in to your account</h2>
                <form id="loginFormElement">
                    <div class="form-group">
                        <label for="loginUsername">Username</label>
                        <input
                            type="text"
                            id="loginUsername"
                            name="username"
                            placeholder="Enter your username"
                            required
                            autocomplete="username"
                        >
                    </div>
                    <div class="form-group">
                        <label for="loginPassword">Password</label>
                        <input
                            type="password"
                            id="loginPassword"
                            name="password"
                            placeholder="Enter your password"
                            required
                            autocomplete="current-password"
                        >
                    </div>
                    <div id="loginError" class="error-message"></div>
                    <button type="submit" class="btn-primary">Sign In</button>
                </form>
                <p class="switch-form">
                    Don't have an account?
                    <a href="#" id="showSignup">Sign up</a>
                </p>
            </div>

            <!-- Signup Form -->
            <div id="signupForm" class="form-container" style="display: none;">
                <h2>Create your account</h2>
                <form id="signupFormElement">
                    <div class="form-group">
                        <label for="signupUsername">Username</label>
                        <input
                            type="text"
                            id="signupUsername"
                            name="username"
                            placeholder="Choose a username"
                            required
                            autocomplete="username"
                        >
                        <small>3-20 characters, must start with a letter</small>
                    </div>
                    <div class="form-group">
                        <label for="signupPassword">Password</label>
                        <input
                            type="password"
                            id="signupPassword"
                            name="password"
                            placeholder="Create a password"
                            required
                            autocomplete="new-password"
                        >
                        <small>6-16 characters with at least one digit and special character</small>
                    </div>
                    <div id="signupError" class="error-message"></div>
                    <button type="submit" class="btn-primary">Create Account</button>
                </form>
                <p class="switch-form">
                    Already have an account?
                    <a href="#" id="showLogin">Sign in</a>
                </p>
            </div>
        </div>
    </div>

    <script src="js/auth.js"></script>
</body>
</html>
